<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clarity">
<meta name="theme-color" content="#0a100c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>C.L.A.R.I.T.Y.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a100c; --ink:#e7efe8; --mut:#9db0a2; --leaf:#8db39a; --leaf-2:#bbd5c2; --leaf-deep:#6e9277;
    --line:rgba(141,179,154,.28); --glass:rgba(22,33,26,.72); --amber:#e9d8a6;
    --f-display:"Fraunces", Georgia, serif; --f-body:"Instrument Sans", system-ui, sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;cursor:pointer}
  #world{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s ease}
  body.ready #world{opacity:1}
  #loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);transition:opacity .6s}
  body.ready #loading{opacity:0;pointer-events:none}

  .hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 26px) max(30px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(30px, env(safe-area-inset-left))}
  .hud > *{pointer-events:auto}
  .brand{position:absolute;top:calc(env(safe-area-inset-top) + 24px);left:max(30px, env(safe-area-inset-left))}
  .brand .n{font-family:var(--f-mono);font-weight:500;font-size:clamp(13px,1.15vw,17px);letter-spacing:.46em;color:var(--leaf-2)}
  .brand .s{margin-top:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .status{position:absolute;top:calc(env(safe-area-inset-top) + 26px);right:max(30px, env(safe-area-inset-right));display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut);opacity:.6}
  .dot.on{background:var(--leaf);opacity:1;box-shadow:0 0 10px var(--leaf)}
  .dot.busy{background:var(--amber);opacity:1;box-shadow:0 0 10px var(--amber)}
  .dot.err{background:#e58a7d;opacity:1}

  .clock{position:absolute;left:max(30px, env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 92px);pointer-events:none}
  .time{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(56px,7.4vw,124px);line-height:.95;color:#fff;font-variation-settings:"opsz" 144;letter-spacing:-.01em}
  .date{margin-top:12px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);white-space:nowrap;pointer-events:none;transition:color .4s}
  body[data-mode="speaking"] .hint{color:var(--leaf-2)}
  body[data-mode="listening"] .hint{color:var(--ink)}

  .panel{position:absolute;right:max(30px, env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 76px);bottom:calc(env(safe-area-inset-bottom) + 92px);width:min(380px,28vw);
    display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:18px 20px;cursor:default}
  .panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:1px solid rgba(231,239,232,.8);pointer-events:none}
  .panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  .panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
  .panel h3{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
  .log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:#2b3c31 transparent}
  .msg{font-size:15.5px;line-height:1.55;color:#d9e4dc}
  .msg .who{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:3px}
  .msg.agent .who{color:var(--leaf)}
  .msg.user{color:#f0ead8}.msg.user .who{color:var(--amber)}
  .empty{color:#7f9586;font-size:14.5px;line-height:1.6}
  .empty em{font-family:var(--f-display);color:#c9d8cd}

  .controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px}
  button{font:500 11.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:rgba(10,16,12,.55);border:1px solid rgba(231,239,232,.32);
    padding:0 18px;height:42px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .25s,border-color .25s}
  button:hover{background:rgba(141,179,154,.16);border-color:rgba(231,239,232,.7)}
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.primary:hover{background:#fff}
  button.on{border-color:var(--leaf);color:var(--leaf-2)}
  button[hidden]{display:none}
  .note{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);width:min(680px,92vw);text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--mut);pointer-events:none}
  .note.err{color:#f0a99d}

  @media (max-width:760px){
    .brand .s{display:none}
    .clock{left:auto;right:max(18px, env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 18px);bottom:auto;text-align:right}
    .status{top:auto;right:auto;left:max(18px, env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 48px);font-size:10px}
    .brand{left:max(18px, env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 20px)}
    .time{font-size:40px}
    .date{font-size:10px;margin-top:6px}
    .panel{left:12px;right:12px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom) + 76px);height:auto;max-height:24vh;padding:12px 16px}
    .panel h3{margin-bottom:8px}
    .empty{font-size:13.5px}
    .msg{font-size:14.5px}
    .hint{bottom:calc(env(safe-area-inset-bottom) + 76px + 24vh + 14px)}
    #fsBtn{display:none}
    .note{bottom:auto;top:calc(env(safe-area-inset-top) + 84px)}
    button{height:40px;padding:0 15px;font-size:11px}
    .controls{bottom:calc(env(safe-area-inset-bottom) + 20px)}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="world"></canvas>
  <div id="loading">Growing the tree…</div>
  <div class="hud">
    <div class="brand"><div class="n">C.L.A.R.I.T.Y.</div><div class="s">Climb to Clarity</div></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Standby</span></div>
    <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
    <div class="hint" id="hint">Tap the tree to talk</div>
    <aside class="panel">
      <h3>Conversation</h3>
      <div class="log" id="log"><div class="empty" id="empty">Tap the tree, then just speak.<br>Try <em>“What do we have today?”</em> or <em>“Let’s think about HiiDE.”</em></div></div>
    </aside>
    <div class="note" id="note"></div>
    <div class="controls">
      <button class="primary" id="talkBtn">Talk to Clarity</button>
      <button id="endBtn" hidden>End</button>
      <button id="wakeBtn">Wake word: off</button>
      <button id="fsBtn">Full screen</button>
    </div>
  </div>
</div>
<script type="module" src="clarity.js"></script>
</body>
</html>
